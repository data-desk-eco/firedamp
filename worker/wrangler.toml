name = "firedamp-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# D1 binding — fill in `database_id` after running:
#   wrangler d1 create firedamp-analyses
[[d1_databases]]
binding = "DB"
database_name = "firedamp-analyses"
database_id = "e6278e15-1bc8-4cb6-acd2-8a29d555991e"

[vars]
MODEL = "qwen/qwen3-vl-235b-a22b-instruct"
MODEL_FALLBACK = "qwen/qwen3-vl-32b-instruct"
ALLOWED_ORIGINS = "https://research.datadesk.eco,https://data-desk-eco.github.io,https://firedamp-private.pages.dev,http://localhost:8000,http://127.0.0.1:8000"

# Set the OpenRouter key as a secret (NOT in this file):
#   wrangler secret put OPENROUTER_KEY
