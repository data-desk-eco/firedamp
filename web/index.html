<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>firedamp / methane plume aggregator</title>
    <meta name="ogim-bucket" content="https://storage.googleapis.com/firedamp-data">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%2322d3ee%22/%3E%3C/svg%3E">
    <link rel="stylesheet" href="vendor/fonts/inter.css">
    <link rel="stylesheet" href="vendor/maplibre-gl.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>

    <div class="panel glass left-panel" id="left-panel">
        <div class="panel-header">
            <h1><a href="https://github.com/data-desk-eco/firedamp">firedamp</a></h1>
            <span class="collapse-toggle" id="collapse-toggle"><svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,8 6,4 10,8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </div>
        <p class="subtitle">Methane plume aggregator</p>
        <div class="panel-body" id="panel-body">
            <div class="source-toggles">
                <button class="source-btn active" data-src="cm" style="--src-color: #00ffff">CM</button>
                <button class="source-btn active" data-src="imeo" style="--src-color: #ff00ff">IMEO</button>
                <button class="source-btn active" data-src="sron" style="--src-color: #ffff00">SRON</button>
            </div>
            <div class="separator"></div>
            <div class="filter-group">
                <div class="filter-label">Sector</div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-sec="all">All</button>
                    <button class="filter-btn" data-sec="og">O&amp;G</button>
                    <button class="filter-btn" data-sec="coal">Coal</button>
                    <button class="filter-btn" data-sec="waste">Waste</button>
                </div>
            </div>
            <div class="filter-group">
                <div class="filter-label">Year</div>
                <div class="filter-buttons year-buttons">
                    <button class="filter-btn active" data-year="all">All</button>
                    <button class="filter-btn" data-year="2024">24</button>
                    <button class="filter-btn" data-year="2025">25</button>
                    <button class="filter-btn" data-year="2026">26</button>
                </div>
            </div>
            <div class="filter-group">
                <div class="filter-label">Rate (t/hr)</div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-rate="all">All</button>
                    <button class="filter-btn" data-rate="1">&gt;1</button>
                    <button class="filter-btn" data-rate="5">&gt;5</button>
                    <button class="filter-btn" data-rate="10">&gt;10</button>
                    <button class="filter-btn" data-rate="20">&gt;20</button>
                </div>
            </div>
            <div class="separator"></div>
            <div class="filter-group">
                <label class="toggle-row">
                    <span class="filter-label">OGIM infrastructure</span>
                    <input type="checkbox" id="ogim-toggle">
                </label>
            </div>
        </div>
    </div>

    <div class="panel glass right-panel hidden" id="right-panel">
    </div>

    <div class="panel glass legend" id="legend">
        <h4 class="label-sm legend-header">
            <span class="legend-title-expanded">Rate (t/hr)</span>
            <span class="legend-title-collapsed">Legend</span>
            <span class="legend-collapse" id="legend-collapse"><svg width="10" height="6" viewBox="0 0 10 6"><polyline points="1,5 5,1 9,5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </h4>
        <div class="legend-body" id="legend-body">
            <div class="legend-item"><div class="legend-size-wrap"><div class="legend-size-circle" style="width:24px;height:24px"></div></div>10+</div>
            <div class="legend-item"><div class="legend-size-wrap"><div class="legend-size-circle" style="width:16px;height:16px"></div></div>5</div>
            <div class="legend-item"><div class="legend-size-wrap"><div class="legend-size-circle" style="width:10px;height:10px"></div></div>1</div>
            <div class="legend-item"><div class="legend-size-wrap"><div class="legend-size-circle" style="width:6px;height:6px"></div></div>&lt; 0.5</div>
            <h4 class="label-sm legend-section">Source</h4>
            <div class="legend-item"><div class="legend-src-wrap"><div class="legend-circle-fill" style="background: #00ffff"></div></div>Carbon Mapper</div>
            <div class="legend-item"><div class="legend-src-wrap"><div class="legend-circle-fill" style="background: #ff00ff"></div></div>IMEO / MARS</div>
            <div class="legend-item"><div class="legend-src-wrap"><div class="legend-circle-fill" style="background: #ffff00"></div></div>SRON</div>
            <div class="legend-infra-section" id="legend-infra">
                <h4 class="label-sm legend-section">Infrastructure</h4>
                <div class="legend-item"><div class="legend-symbol"><span class="legend-symbol-x">&times;</span></div>Wells</div>
                <div class="legend-item"><div class="legend-symbol"><div class="legend-symbol-line"></div></div>Pipelines</div>
                <div class="legend-item"><div class="legend-symbol"><div class="legend-symbol-diamond"></div></div>Facilities</div>
            </div>
        </div>
    </div>

    </svg></a>

    <script src="vendor/maplibre-gl.js"></script>
    <script src="vendor/pmtiles.js"></script>
    <script src="app.js"></script>
</body>
</html>
