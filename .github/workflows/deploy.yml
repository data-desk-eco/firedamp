name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Download plumes.bin from release
        run: |
          gh release download latest-data --pattern 'plumes-data.zip' --dir .
          unzip -j plumes-data.zip web/data/plumes.bin -d web/data
          rm plumes-data.zip
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare dist
        run: |
          mkdir dist
          cp web/index.html web/app.js web/style.css web/layers.js dist/
          cp -r web/vendor dist/vendor
          mkdir -p dist/data
          cp web/data/plumes.bin dist/data/
          # Cache-bust app assets with git SHA
          V="${GITHUB_SHA:0:8}"
          sed -i "s|app.js|app.js?v=$V|g; s|style.css|style.css?v=$V|g; s|layers.js|layers.js?v=$V|g" dist/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
