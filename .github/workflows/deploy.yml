name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Download plumes.bin from release
        run: |
          gh release download latest-data --pattern 'plumes-data.zip' --dir .
          unzip -j plumes-data.zip web/data/plumes.bin -d web/data
          rm plumes-data.zip
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare dist
        run: bash scripts/dist.sh "$GITHUB_SHA"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
