name: Update plume data

on:
  schedule:
    # every 6h: carbon mapper publishes new plumes in sub-daily batches, so
    # poll often. sron (weekly) and imeo (blocked/manual) are unaffected.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      STORE: https://s3.WAW3-2.cloudferro.com/datadesk-archive
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install duckdb           # upload_plumes.sh ghgsat guard
        run: |
          curl -sL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"

      # the store holds the previous build (plumes/data.parquet, the byte-diff
      # baseline) and the source-csv cache (plumes/sources.zip — sron's
      # accumulated weeklies + the last good imeo csv, which fetch_imeo keeps
      # on network failure)
      - name: Download previous data from the store
        run: |
          curl -sf "$STORE/plumes/sources.zip" -o sources.zip && unzip -oq sources.zip && rm sources.zip || true
          curl -sf "$STORE/plumes/data.parquet" -o plumes.parquet.prev || true

      - name: Fetch Carbon Mapper + SRON
        run: |
          uv run scripts/fetch_carbon_mapper.py
          uv run scripts/fetch_sron.py

      - name: Fetch IMEO
        run: uv run scripts/fetch_imeo.py
        continue-on-error: true

      - name: Build plumes.parquet
        run: uv run scripts/build.py

      # plumes.parquet is deterministic, so identical bytes ⇒ no new plumes.
      # skip the upload on those runs (most of the 4/day off-cycle ones).
      - name: Detect data change
        id: diff
        run: |
          if [ -f plumes.parquet.prev ] && cmp -s plumes.parquet.prev web/data/plumes.parquet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "plumes.parquet unchanged — skipping upload"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to the store
        if: steps.diff.outputs.changed == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFERRO_S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFERRO_S3_SECRET }}
          AWS_DEFAULT_REGION: WAW3-2
        run: |
          bash scripts/upload_plumes.sh
          zip -rq sources.zip data/imeo_plumes.csv data/carbon_mapper.csv data/sron_all.csv data/sron
          aws --endpoint-url https://s3.WAW3-2.cloudferro.com s3 cp sources.zip s3://datadesk-archive/plumes/sources.zip --no-progress

      # data staleness must not go unnoticed: file an issue on failure
      # (skipped if one is already open, so persistent breakage = one issue)
      - name: Alert on failure
        if: failure()
        run: |
          gh issue list --search 'update-data failing in:title' --state open --json number --jq '.[0].number' | grep -q . || \
            gh issue create --title 'update-data failing' --body "failed run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
