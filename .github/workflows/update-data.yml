name: Update plume data

on:
  schedule:
    # every 6h: carbon mapper publishes new plumes in sub-daily batches, so
    # poll often. sron (weekly) and imeo (blocked/manual) are unaffected.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download existing data from release
        run: |
          gh release download latest-data --pattern 'plumes-data.zip' --dir . || true
          if [ -f plumes-data.zip ]; then
            unzip -o plumes-data.zip -d .
            rm plumes-data.zip
            cp web/data/plumes.parquet plumes.parquet.prev 2>/dev/null || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch Carbon Mapper + SRON
        run: |
          uv run scripts/fetch_carbon_mapper.py
          uv run scripts/fetch_sron.py

      - name: Fetch IMEO
        run: uv run scripts/fetch_imeo.py
        continue-on-error: true

      - name: Build plumes.parquet
        run: uv run scripts/build.py

      # plumes.bin is deterministic, so identical bytes ⇒ no new plumes.
      # skip upload + deploy on those runs (most of the 4/day off-cycle ones).
      - name: Detect data change
        id: diff
        run: |
          if [ -f plumes.parquet.prev ] && cmp -s plumes.parquet.prev web/data/plumes.parquet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "plumes.parquet unchanged — skipping upload and deploy"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload data to release
        if: steps.diff.outputs.changed == 'true'
        run: |
          zip -r plumes-data.zip \
            web/data/plumes.parquet \
            data/imeo_plumes.csv \
            data/carbon_mapper.csv \
            data/sron_all.csv
          gh release upload latest-data plumes-data.zip --clobber
          rm plumes-data.zip
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare dist
        if: steps.diff.outputs.changed == 'true'
        run: bash scripts/dist.sh "$GITHUB_SHA"

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/configure-pages@v6
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        if: steps.diff.outputs.changed == 'true'
        uses: actions/deploy-pages@v5

      # data staleness must not go unnoticed: file an issue on failure
      # (skipped if one is already open, so persistent breakage = one issue)
      - name: Alert on failure
        if: failure()
        run: |
          gh issue list --search 'update-data failing in:title' --state open --json number --jq '.[0].number' | grep -q . || \
            gh issue create --title 'update-data failing' --body "failed run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
